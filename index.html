<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPIダッシュ!街まわり営業</title>
<meta name="theme-color" content="#1d2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPIダッシュ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f6; --grid:#dae3ea; --ink:#1d2a4a; --ink-soft:#56627c; --block-line:#8fa1b3;
  --orange:#f09000; --orange-soft:#ffe2b0; --red:#d6413a; --green:#2f8f5b; --panel:#ffffff; --on-orange:#1d2a4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131a29; --grid:#1d273b; --ink:#e7ecf5; --ink-soft:#9aa6bf; --block-line:#4a5c80;
    --orange:#ffa31a; --orange-soft:#4a3410; --red:#ff6b61; --green:#5cc98a; --panel:#1a2336; --on-orange:#131a29;
  }
}
:root[data-theme="dark"]{
  --paper:#131a29; --grid:#1d273b; --ink:#e7ecf5; --ink-soft:#9aa6bf; --block-line:#4a5c80;
  --orange:#ffa31a; --orange-soft:#4a3410; --red:#ff6b61; --green:#5cc98a; --panel:#1a2336; --on-orange:#131a29;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{max-width:1320px;margin:0 auto;padding:10px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "view" "side"}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1fr) 310px;grid-template-areas:"hud hud" "view side";padding:14px 16px}}
.hud{grid-area:hud;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.hud h1{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1.3rem;margin:0;margin-right:auto}
.clock{font-family:"DotGothic16",sans-serif;font-size:1.9rem;line-height:1}
.chip{font-size:.88rem;color:var(--ink-soft)}
.stam{display:flex;align-items:center;gap:6px;font-size:.85rem}
.bar{position:relative;height:10px;border:2px solid var(--ink);border-radius:3px;background:var(--panel);overflow:hidden;display:block}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--orange);transition:width .25s}
.stam .bar{width:110px}
.stam .bar.low>i{background:var(--red)}

#view{grid-area:view;position:relative;min-width:0;height:62vh;min-height:360px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#9fc6e8;touch-action:none}
@media (min-width:900px){#view{height:calc(100vh - 120px);min-height:460px}}
#gl,#gl canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#mini{position:absolute;top:10px;right:10px;width:200px;height:143px;border:2px solid #1d2a4a;border-radius:8px;background:#f4f1ec;box-shadow:3px 3px 0 #1d2a4a;cursor:zoom-in;transition:width .2s,height .2s}
#mini.big{width:min(560px,80%);height:auto;aspect-ratio:28/20;cursor:zoom-out}
.miniTag{position:absolute;top:14px;right:16px;font:400 .75rem "DotGothic16",sans-serif;color:#1d2a4a;background:rgba(255,255,255,.85);padding:0 5px;border-radius:3px;pointer-events:none}
#banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);font:400 1.15rem "DotGothic16",sans-serif;color:#fff;background:rgba(20,26,45,.72);padding:4px 16px;border-radius:4px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#banner.show{opacity:1}
#actBtn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:1rem;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#actBtn:active{transform:translate(calc(-50% + 3px),3px)}
#joy{position:absolute;left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(29,42,74,.55);display:none;pointer-events:none;z-index:3}
#joy.on{display:block}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--orange);border:2px solid #1d2a4a}
@media (max-width:600px){#mini{width:132px;height:94px}#mini.big{width:92%;height:auto}.miniTag{right:14px}}
@media (pointer:coarse){#actBtn{left:auto;right:18px;transform:none}#actBtn:active{transform:translate(3px,3px)}}
.zoom{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px}
@media (pointer:coarse){.zoom{bottom:auto;top:170px}}
.zoom .btn{width:38px;height:38px;padding:0;font-size:1.1rem}
.keys{position:absolute;left:10px;bottom:8px;font-size:.78rem;color:#1d2a4a;background:rgba(255,255,255,.78);padding:2px 8px;border-radius:4px;pointer-events:none}
@media (pointer:coarse){.keys{display:none}}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:var(--panel);color:var(--ink)}

.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.box{border:2px solid var(--ink);border-radius:8px;background:var(--panel);padding:10px 12px}
.box h2{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.kpi{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:4px 8px;font-size:.9rem;margin:4px 0}
.kpi .bar{height:12px}
.kpi.done .bar>i{background:var(--green)}
.kpi span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.near{min-height:120px;font-size:.88rem}
.near .nm{font-weight:900;font-size:1rem}
.muted{color:var(--ink-soft)}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:3px;padding:0 5px;font-size:.78rem;margin:2px 4px 2px 0}
.tag.idle{border-color:var(--green);color:var(--green)}
.tag.peak,.tag.holiday,.tag.lost{border-color:var(--red);color:var(--red)}
.log{list-style:none;margin:0;padding:0;font-size:.84rem;max-height:180px;overflow:auto}
.log li{padding:3px 0;border-top:1px dashed var(--grid)}
.log li:first-child{border-top:0}
.log time{font-family:"DotGothic16",sans-serif;color:var(--ink-soft);margin-right:6px}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .05s,box-shadow .05s;user-select:none;-webkit-user-select:none;line-height:1.35}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn.pri{background:var(--orange);color:var(--on-orange)}
.btn.sm{padding:3px 8px;font-size:.8rem;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn small{font-weight:400;display:block;font-size:.78rem}
#view .btn{color:#1d2a4a;background:#fff;border-color:#1d2a4a;box-shadow:3px 3px 0 #1d2a4a}
#view .btn.pri{background:#f09000}
.overlay{position:fixed;inset:0;background:rgba(15,21,35,.6);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;overflow:auto}
.overlay[hidden]{display:none}
.card{width:100%;max-width:500px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);padding:18px;max-height:100%;overflow:auto}
.card.wide{max-width:780px}
.card h3{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1.35rem;margin:0 0 2px;line-height:1.3}
.card p{margin:.4em 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row .btn{flex:1 1 calc(50% - 10px)}
.row .btn.full{flex-basis:100%}
.shophead{display:flex;gap:12px;align-items:center}
.shophead .ic{font-size:2.3rem;line-height:1;width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--orange);border-radius:50%;background:var(--orange-soft);flex:none}
.who{font-size:.86rem;margin-top:8px;padding:6px 10px;border:1px dashed var(--block-line);border-radius:6px}
.who div{margin:1px 0}
.bubble{font-family:"DotGothic16",sans-serif;font-size:1.02rem;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;margin:14px 0 10px;position:relative;background:var(--paper);min-height:3.2em}
.bubble::before{content:"";position:absolute;top:-9px;left:24px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.bubble .sp{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:.78rem;color:var(--ink-soft);margin-bottom:2px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.meters .bar{height:14px}
.pips{letter-spacing:2px;color:var(--orange)}
.note{font-size:.84rem;color:var(--ink-soft);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
th,td{border-bottom:1px solid var(--grid);padding:6px 4px;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
.list td,.list th{text-align:left}
td.ok{color:var(--green);font-weight:700}
td.ng{color:var(--red);font-weight:700}
.tblwrap{overflow-x:auto}
.rank{font-family:"DotGothic16",sans-serif;font-size:4.5rem;line-height:1;color:var(--orange);margin:6px 0}
.slack{border-left:4px solid var(--orange);padding:6px 10px;background:var(--paper);border-radius:0 6px 6px 0;font-size:.92rem;margin-top:10px}
.rules{padding-left:1.2em;margin:.6em 0;font-size:.9rem}
.rules li{margin:.25em 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:.9rem;max-width:92vw;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--ink-soft)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
#fade.on{opacity:1}
#vui{position:absolute;inset:0;pointer-events:none;z-index:5;color:#1d2a4a}
#vui[hidden]{display:none}
.vhead{position:absolute;top:10px;left:10px;max-width:min(390px,calc(100% - 20px));background:rgba(255,255,255,.93);border:2px solid #1d2a4a;border-radius:8px;padding:8px 12px;font-size:.82rem;pointer-events:auto;box-shadow:3px 3px 0 #1d2a4a}
.vname{font-weight:900;font-size:1rem}
.vsub{color:#56627c}
.vmeters{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;margin-top:4px}
.vmeters .bar{height:10px;border-color:#1d2a4a;background:#fff}
.vmeters .bar>i{background:#f09000}
.vmeters .bar.pat>i{background:#2f8f5b}
.vmeters .bar.pat.low>i{background:#d6413a}
.vmeters .pips{color:#f09000}
.vnotes{margin-top:4px;font-size:.78rem;color:#56627c;border-top:1px dashed #b9c2cc;padding-top:4px}
#vui .tag{border-color:#1d2a4a;color:#1d2a4a}
#vui .tag.idle{border-color:#2f8f5b;color:#2f8f5b}
#vui .tag.peak,#vui .tag.closed{border-color:#d6413a;color:#d6413a}
.vbox{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.96);border:2px solid #1d2a4a;border-radius:10px;box-shadow:4px 4px 0 #1d2a4a;padding:10px 14px;pointer-events:auto;max-height:56%;overflow:auto}
.vsp{font-size:.78rem;color:#56627c;min-height:1.1em;font-weight:700}
.vline{font-family:"DotGothic16",sans-serif;font-size:1.05rem;min-height:2.7em;cursor:pointer;line-height:1.5}
.vline.narr{color:#56627c}
.vstage{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:.78rem;color:#8a93a3;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #c9d0d8}
.vstage .cur{color:#1d2a4a;font-weight:900;background:#ffe2b0;padding:0 6px;border-radius:3px}
.vstage .done{color:#2f8f5b}
.vstage i{font-style:normal;color:#b9c2cc}
.vyou{font-size:.85rem;color:#26365e;background:#eef3f8;border-left:3px solid #26365e;padding:3px 8px;margin-bottom:6px;border-radius:0 4px 4px 0}
.vcomps{margin-top:5px;padding-top:4px;border-top:1px dashed #b9c2cc;font-size:.8rem}
.vcomps .ok{color:#2f8f5b;font-weight:900}
.vbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.vbtns .btn{font-size:.88rem;padding:6px 10px;text-align:left}
#view.inVisit #mini,#view.inVisit .miniTag,#view.inVisit #joy,#view.inVisit .zoom,#view.inVisit #actBtn,#view.inVisit .keys,#view.inVisit #banner{display:none!important}
@media (max-width:600px){#view.inVisit{height:88vh}.vstage{font-size:.68rem}.vyou{font-size:.76rem}.vcomps{font-size:.7rem}.vhead{font-size:.72rem;padding:5px 8px;max-width:calc(100% - 20px)}.vhead .vmeters{grid-template-columns:auto 1fr auto auto 1fr auto;gap:2px 5px}.vnotes{display:none}.vbox{max-height:48%;padding:8px 10px}.vbtns{grid-template-columns:repeat(2,1fr);gap:6px}.vbtns .btn{font-size:.8rem;padding:5px 7px}.vline{font-size:.95rem}}
#pgQuick{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);font-size:.85rem;padding:5px 10px}
@media (pointer:coarse){#pgQuick{left:auto;right:18px;transform:none;bottom:76px}}
#view.inVisit #pgQuick{display:none!important}
#view.mapOpen .zoom,#view.mapOpen #sheetBtn,#view.mapOpen #pgQuick,#view.mapOpen #actBtn{display:none!important}
#mini.big{z-index:4}
.howto{margin-top:12px;border-top:1px dashed var(--grid);padding-top:8px}.howto summary{cursor:pointer;font-weight:700;color:var(--ink-soft)}
#navChip{position:absolute;left:10px;bottom:40px;display:flex;align-items:center;gap:8px;background:#fff;color:#1d2a4a;border:2px solid #1d2a4a;border-radius:6px;padding:4px 6px 4px 10px;font-size:.85rem;font-weight:700;box-shadow:3px 3px 0 #1d2a4a;z-index:3}
#navChip[hidden]{display:none}
#navX{font:inherit;border:0;background:#1d2a4a;color:#fff;border-radius:4px;width:26px;height:26px;cursor:pointer}
@media (pointer:coarse){#navChip{bottom:auto;top:10px;left:10px}}
#pauseOv{position:absolute;inset:0;background:rgba(15,21,35,.45);display:grid;place-items:center;z-index:4;cursor:pointer}
#pauseOv[hidden]{display:none}
#pauseOv div{background:#fff;color:#1d2a4a;border:2px solid #1d2a4a;border-radius:8px;padding:12px 22px;font:400 1.3rem "DotGothic16",sans-serif;text-align:center;box-shadow:4px 4px 0 #1d2a4a}
#pauseOv small{display:block;font:400 .8rem "Zen Kaku Gothic New",sans-serif;color:#56627c;margin-top:4px}
.phone{text-align:center}
.phone .ringIc{font-size:3rem;line-height:1;display:inline-block;animation:ring .5s ease-in-out infinite}
.phone.sm{display:flex;align-items:center;gap:10px;text-align:left}.phone.sm .ringIc{font-size:1.8rem}
.phone .ringIc.still{animation:none}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.card .vyou{font-size:.85rem;color:#26365e;background:#eef3f8;border-left:3px solid #26365e;padding:3px 8px;margin-top:10px;border-radius:0 4px 4px 0}
.vbtns kbd{display:inline-block;min-width:1.3em;margin-right:6px;padding:0 4px;border:1.5px solid #8a93a3;border-radius:3px;font:700 .72rem system-ui,sans-serif;color:#56627c;text-align:center;vertical-align:1px}
.vbtns .btn.pri kbd{border-color:#1d2a4a;color:#1d2a4a}
@media (pointer:coarse){.phone{text-align:center}
.phone .ringIc{font-size:3rem;line-height:1;display:inline-block;animation:ring .5s ease-in-out infinite}
.phone.sm{display:flex;align-items:center;gap:10px;text-align:left}.phone.sm .ringIc{font-size:1.8rem}
.phone .ringIc.still{animation:none}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.card .vyou{font-size:.85rem;color:#26365e;background:#eef3f8;border-left:3px solid #26365e;padding:3px 8px;margin-top:10px;border-radius:0 4px 4px 0}
.vbtns kbd{display:none}}
#view.inVisit #navChip,#view.inVisit #pauseOv{display:none!important}
html,body{overscroll-behavior:none}
#view,#vui,.pad,.btn,#mini{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn,#mini,canvas{touch-action:manipulation}
#view canvas{touch-action:none}
#sheetBtn,#sheetClose,#sheetBack{display:none}
@media (max-width:600px){
  body{overflow:hidden;position:fixed;inset:0}
  .app{padding:4px 6px;gap:6px;height:100dvh;grid-template-rows:auto 1fr;grid-template-areas:"hud" "view"}
  .hud{gap:4px 10px;padding-bottom:5px;border-bottom-width:1.5px;padding-top:2px}
  .hud h1{display:none}
  .clock{font-size:1.45rem;margin-right:auto;order:-1}
  .chip{font-size:.78rem}
  .stam .bar{width:70px}
  #pauseBtn{padding:3px 7px}
  #view,#view.inVisit{height:auto;min-height:0}
  #sheetBtn{display:block;position:absolute;left:8px;top:8px;z-index:3;font-size:.8rem;padding:4px 8px;box-shadow:2px 2px 0 #1d2a4a}
  #navChip{top:46px!important}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:72dvh;overflow:auto;background:var(--paper);border-top:2px solid var(--ink);border-radius:14px 14px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
  .side.open{transform:none}
  #sheetClose{display:block;align-self:flex-end}
  #sheetBack:not([hidden]){display:block;position:fixed;inset:0;background:rgba(15,21,35,.4);z-index:14}
  #view.inVisit #sheetBtn{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <h1>KPIダッシュ!街まわり営業</h1>
    <span class="chip" id="date">10/5(月)</span>
    <span class="chip" id="weather">晴れ</span>
    <span class="chip" id="apo"></span>
    <button class="btn sm" id="callChip" hidden>📞 不在着信</button>
    <span class="clock" id="clock">9:00</span>
    <button class="btn sm" id="pauseBtn" aria-pressed="false">⏸ 一時停止</button>
    <button class="btn sm" id="setBtn" aria-label="設定">⚙</button>
    <span class="stam">体力 <span class="bar" id="stambar"><i style="width:100%"></i></span></span>
  </header>

  <div id="view">
    <div id="gl"></div>
    <canvas id="mini" width="560" height="400" aria-label="エリアマップ。クリックで拡大"></canvas>
    <span class="miniTag">MAP</span>
    <div id="banner"></div>
    <div id="joy" aria-hidden="true"><div id="knob"></div></div>

let R=null;
function bfs(sx,sy,goal){
  const key=(x,y)=>y*COLS+x,gk=key(goal[0],goal[1]),prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){
    const [x,y]=q.shift();
    if(key(x,y)===gk){const p=[];let k=gk;while(k!==key(sx,sy)){p.unshift([k%COLS,Math.floor(k/COLS)]);k=prev.get(k);}return p;}
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(isRoad(nx,ny)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),key(x,y));q.push([nx,ny]);}}
  }
  return [];
}
function rivalAdvance(gm){
  if(!R||G.time<10*60||G.time>18*60+30)return;
  while(gm>0){
    if(R.busy>0){const u=Math.min(R.busy,gm);R.busy-=u;gm-=u;if(R.busy<=0)R.target=null;continue;}
    if(!R.target){
      const c=SHOPS.filter(s=>!s.won&&!s.lost&&!s.rivalToday&&s.closed!==G.day-1&&!(V&&V.s===s));
      if(!c.length)return;
      R.target=pick(c);R.path=bfs(R.tx,R.ty,R.target.door);R.prog=0;continue;
    }
    if(R.path.length){
      const need=(1-R.prog)/0.45;
      if(gm>=need){gm-=need;R.ptx=R.tx;R.pty=R.ty;[R.tx,R.ty]=R.path.shift();R.prog=0;}
      else{R.prog+=gm*0.45;gm=0;}
      continue;
    }
    const s=R.target;if(V&&V.s===s){R.target=null;continue;}s.rivalToday=true;R.busy=18;
    if(!s.won){
      s.carry=Math.max(0,s.carry-8);
      const near=Math.hypot(G.x-wx(R.tx),G.z-wz(R.ty))<28;
      if(s.carry<25&&!G.apos.some(a=>a.si===SHOPS.indexOf(s))&&Math.random()<.12){s.lost=true;G.news.push(`${s.name}が他媒体と契約`);addLog(`⚠ ${s.name}、他媒体で決めたらしい…`);}
      else if(near)addLog(`他媒体の営業が${s.name}に入っていくのを見かけた`);
    }
  }
}

}

function spawnPed(far){
  for(let i=0;i<40;i++){
    const x=ri(0,COLS-1),y=ri(1,ROWS-1);
    if(!isWalk(x,y))continue;
    if(Math.random()*3>pedWeight(x,y))continue;
    if(far&&Math.hypot(wx(x)-G.x,wz(y)-G.z)<14)continue;
    const d=pick(DIRS.filter(([dx,dy])=>isWalk(x+dx,y+dy)));if(!d)continue;

    const g=person(office?{shirt:'#f8f9fa',pants:pick(['#22223b','#2f3e46','#3d405b']),arm:pick(['#f8f9fa','#2f3e46']),tie:Math.random()<.5?pick(['#1d3557','#c1121f','#2a9d8f']):null,bag:Math.random()<.5}:{});

function nextPedTile(p){
  const [dx,dy]=p.d,opts=DIRS.filter(([ax,ay])=>isWalk(p.tx+ax,p.ty+ay)&&!(ax===-dx&&ay===-dy));
  if(!isWalk(p.tx+dx,p.ty+dy)||(opts.length>1&&Math.random()<.3))p.d=opts.length?pick(opts):[-dx,-dy];
  if(!isWalk(p.tx+p.d[0],p.ty+p.d[1]))p.d=[-p.d[0],-p.d[1]];
  if(!isWalk(p.tx+p.d[0],p.ty+p.d[1]))return;
  p.tx+=p.d[0];p.ty+=p.d[1];
  if(Math.random()<.25)p.side=-p.side;
  p.tgt=pedPoint(p.tx,p.ty,p.d,p.side);
  if((grid[p.ty][p.tx].arcade||grid[p.ty][p.tx].t==='park')&&Math.random()<.12){p.stop=rnd(1.5,4);p.look=Math.random()*Math.PI*2;}
}
let spawnT=0;
function updatePeds(dt){
  spawnT-=dt;const tgt=pedTarget();
  if(spawnT<=0){spawnT=.35;
    if(peds.length<tgt)spawnPed(peds.length>8);
    else if(peds.length>tgt+3){let fi=-1,fd=0;peds.forEach((p,i)=>{const d=Math.hypot(p.g.position.x-G.x,p.g.position.z-G.z);if(d>fd&&!p.leave){fd=d;fi=i;}});if(fi>=0)peds[fi].leave=true;}
  }
  for(let i=peds.length-1;i>=0;i--){
    const p=peds[i],g=p.g;
    if(p.leave){g.scale.multiplyScalar(Math.pow(.02,dt));if(g.scale.x<.05){scene.remove(g);peds.splice(i,1);}continue;}
    if(p.grow<1){p.grow=Math.min(1,p.grow+dt*2.5);g.scale.setScalar(p.grow);}
    g.userData.umb.visible=G.rain;
    if(p.stop>0){p.stop-=dt;animIdle(g,dt,false);turnTo(g,p.look,dt,4);continue;}
    const dx=p.tgt.x-g.position.x,dz=p.tgt.z-g.position.z,dist=Math.hypot(dx,dz);
    let sp=p.speed*(G.rain?1.15:1);
    const pd=Math.hypot(g.position.x-G.x,g.position.z-G.z);if(pd<.9)sp*=.3;
    if(dist<.15){nextPedTile(p);continue;}
    g.position.x+=dx/dist*sp*dt;g.position.z+=dz/dist*sp*dt;
    turnTo(g,Math.atan2(dx,dz),dt);
    animWalk(g,dt,sp);
    if(p.tipsy)g.rotation.z=Math.sin(g.userData.phase*.5)*.08;
  }
}

function bfsWalk(sx,sy,goal){
  const key=(x,y)=>y*COLS+x,gk=key(goal[0],goal[1]),prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();
    if(key(x,y)===gk){const p=[];let k=gk;while(k!==key(sx,sy)){p.unshift([k%COLS,Math.floor(k/COLS)]);k=prev.get(k);}return p;}
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(isWalk(nx,ny)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),key(x,y));q.push([nx,ny]);}}}
  return null;
}
function navTo(tx,ty,inter){

  const sx=Math.floor(G.x/TS),sy=Math.floor(G.z/TS),goal=inter?inter.door:[tx,ty];
  if(!isWalk(goal[0],goal[1])){toast('そこへは歩いて行けない');return;}
  const path=bfsWalk(sx,sy,goal);if(!path){toast('そこへは歩いて行けない');return;}

  else if(!path.length)pts.push([wx(tx),wz(ty)]);

  const [lx,lz]=pts[pts.length-1];navMark.position.set(lx,.09,lz);navMark.visible=true;navLine.visible=true;updateNavLine();

  ray.setFromCamera(ptr,camera);ray.camera=camera;
  const hit=ray.intersectObjects(PICK,true).find(h=>{let o=h.object;while(o&&!o.userData.inter)o=o.parent;return o&&o.visible!==false;});
  if(hit){let o=hit.object;while(!o.userData.inter)o=o.parent;const it=o.userData.inter;navTo(it.tx,it.ty,it);return;}
  const v=new T3.Vector3();if(!ray.ray.intersectPlane(new T3.Plane(new T3.Vector3(0,1,0),0),v))return;
  const tx=Math.floor(v.x/TS),ty=Math.floor(v.z/TS);

function animOwner(dt,o,talking){
  const u=o.userData;u.phase+=dt;const t=u.phase;
  const toP=Math.atan2(V.player.position.x-o.position.x,V.player.position.z-o.position.z);
  turnTo(o,talking?toP:0,dt,4);
  let aL={x:0,y:0,z:0},aR={x:0,y:0,z:0},hx=0,hy=0,lean=0;
  const r=V.reactT>0&&o===V.owner?V.react:null;
  if(!talking){
    if(V.act==='chop'){aR.x=-1.0-Math.abs(Math.sin(t*9))*.5;aL.x=-.9;aL.z=.2;hx=.5;}
    else if(V.act==='read'){aL={x:-1.25,y:0,z:.35};aR={x:-1.25,y:0,z:-.35};hx=.55;}
    else if(V.act==='wipe'){aR.x=-.95;aR.z=Math.sin(t*4)*.4;hx=.4;}
  } else {
    if(o===V.owner&&(V.interest<25&&!V.over)){aL={x:-1.3,y:0,z:.8};aR={x:-1.3,y:0,z:-.8};}
    else aR.x=-Math.max(0,Math.sin(t*1.9))*.45;
    if(o===V.owner&&V.interest>60)lean=.1;
    hx=.06+Math.sin(t*1.2)*.03;
  }
  if(r==='nod')hx=.18+Math.sin(t*13)*.22;
  if(r==='shake')hy=Math.sin(t*15)*.45;
  if(r==='laugh'){hx=-.18;}
  if(r==='lean'){lean=.2;hx=.12;}
  if(r==='look')hy=-.85;
  if(r==='watch'){aL={x:-1.45,y:0,z:.55};hx=.5;}
  if(r==='sad')hx=.45;
  if(r==='cross'){aL={x:-1.3,y:0,z:.8};aR={x:-1.3,y:0,z:-.8};}
  if(r==='cheer'){aL={x:-2.9,y:0,z:-.25};aR={x:-2.9,y:0,z:.25};hx=-.2;}
  const k=Math.min(1,dt*9);
  ['x','y','z'].forEach(a=>{u.armL.rotation[a]=lerp(u.armL.rotation[a],aL[a],k);u.armR.rotation[a]=lerp(u.armR.rotation[a],aR[a],k);});
  u.head.rotation.x=lerp(u.head.rotation.x,hx,k);u.head.rotation.y=lerp(u.head.rotation.y,hy,k);
  u.body.position.z=lerp(u.body.position.z,lean,k);u.head.position.z=lerp(u.head.position.z,lean*1.5,k);
  u.body.position.y=r==='laugh'?1.04+Math.abs(Math.sin(t*14))*.06:lerp(u.body.position.y,1.04,k);
}

function updateInterior(dt,now){

  V.cust.forEach(c=>{const u=c.userData;u.phase+=dt;u.armR.rotation.x=-1.0-Math.max(0,Math.sin(u.phase*2+u.off))*.6;u.armL.rotation.x=-.9;u.head.rotation.x=.18+Math.sin(u.phase*2+u.off)*.06;});

    else{const d=Math.sign(u.tx-sf.position.x);sf.position.x+=d*1.2*dt;turnTo(sf,d>0?Math.PI/2:-Math.PI/2,dt);animWalk(sf,dt,1.2);}}
  for(let i=V.walkers.length-1;i>=0;i--){const w=V.walkers[i],g=w.g,tg=w.path[w.i];
    const dx=tg[0]-g.position.x,dz=tg[1]-g.position.z,d=Math.hypot(dx,dz);

    g.position.x+=dx/d*1.6*dt;g.position.z+=dz/d*1.6*dt;turnTo(g,Math.atan2(dx,dz),dt);animWalk(g,dt,1.6);}
  V.hots.forEach(h=>{if(h.marker.visible){const s=.5+Math.sin(now/260+h.id.length)*.05;h.marker.scale.set(s,s,1);}});
  if(V.phone&&V.phoneRing>0){V.phoneRing-=dt;V.phone.userData.ring.rotation.z=Math.sin(now/28)*.18;V.phone.userData.ring.position.y=.13+Math.abs(Math.sin(now/40))*.03;}

  const o=V.helper||V.owner;V.emo.position.set(o.position.x+.35,o.position.y+2.35,o.position.z+.1);

}

    ${(()=>{const ap=G.apos.find(a=>a.si===SHOPS.indexOf(s));return ap?`<div><span class="tag idle">📅 ${ap.day===G.day?'今日':dateOf(ap.day)} ${fmtT(ap.time)} アポ</span></div>`:'';})()}
    ${s.cardLeft&&!s.met&&!s.won?'<div class="muted">📇 名刺を預けてある(折り返し待ち)</div>':''}
    ${s.won||s.lost?'':s.pageChecked?'<div class="muted">📱 店舗ページ確認済み</div>':'<button class="btn sm" id="pgBtn" style="margin:4px 0">📱 店舗ページを確認(3分)</button>'}
    ${s.won||s.lost?'':`<div class="muted">見込み度 ${s.carry}/課題 ${s.needKnown?PRODUCTS[s.need].issue:'?'}/話題 ${s.topicKnown?TOPICS[s.topic]:'?'}</div>`}${rivalNear}`,s);
}
function renderLog(){$('#log').innerHTML=G.log.slice(0,14).map(l=>`<li><time>${fmtT(l.t)}</time>${l.text}</li>`).join('');}
function renderAll(){renderHUD();renderLog();renderTick();}
$('#callChip').onclick=()=>showMissed();
$('#setBtn').onclick=showSettings;
$('#sheetBtn').onclick=()=>toggleSheet();$('#sheetClose').onclick=()=>toggleSheet(false);$('#sheetBack').onclick=()=>toggleSheet(false);
$('#listBtn').onclick=()=>{if(G.mode==='play'){toggleSheet(false);showList();}};

// ================= APP: 画質・セーブ・スリープ防止・インストール =================
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
const COARSE=matchMedia('(pointer:coarse)').matches;
const QUAL={high:{label:'高画質',dpr:2,shadow:true,ped:1,fps:60,mini:20},std:{label:'標準',dpr:1.5,shadow:true,ped:.85,fps:60,mini:12},saver:{label:'省電力',dpr:1,shadow:false,ped:.6,fps:30,mini:6}};
let qMode=LS.get('kpidash3d-q','auto'),qLevel=qMode==='auto'?(COARSE?'std':'high'):qMode;
let vibOn=LS.get('kpidash3d-vib',true);
function applyQuality(){
  const q=QUAL[qLevel];renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,q.dpr));
  if(renderer.shadowMap.enabled!==q.shadow){renderer.shadowMap.enabled=q.shadow;sun.castShadow=q.shadow;scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);}});}
  resize();
}
const perf={t0:0,n:0,lastStep:0};
function autoQuality(now,dt){
  if(qMode!=='auto'||G.mode!=='play'||G.paused||document.hidden)return;
  if(!perf.t0){perf.t0=now;perf.n=0;return;}
  perf.n++;const el=now-perf.t0;
  if(el>4000){const fps=perf.n*1000/el;perf.t0=now;perf.n=0;
    if(fps<38&&qLevel!=='saver'&&now-perf.lastStep>6000){qLevel=qLevel==='high'?'std':'saver';perf.lastStep=now;applyQuality();toast(`動作を軽くするため、画質を「${QUAL[qLevel].label}」にしました`);}}
}
const buzz=p=>{if(vibOn&&navigator.vibrate)try{navigator.vibrate(p);}catch(e){}};
let wakeLock=null;
async function keepAwake(on){try{if(on&&!wakeLock&&'wakeLock' in navigator&&!document.hidden){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}}catch(e){}}
// ---- save / load ----
const SAVE_KEY='kpidash3d-save-v1';
const SHOP_FIELDS=['won','lost','carry','trust','needKnown','refused','refusedBefore','met','topicKnown','bossKnown','objCleared','ate','wrongProp','rivalToday','depth','needHint','objKnown','num','greeted','pageChecked','page','compDis','comps','cardLeft'];
let lastSave=0;
function saveGame(){
  if(!G||!['play','morning'].includes(G.mode))return;
  const g={};['day','time','stamina','x','z','rain','today','total','hint','ate','pray','news','apos','calls','missedCalls','missed'].forEach(k=>g[k]=G[k]);g.log=G.log.slice(0,20);g.mode=G.mode;
  const r=R?{tx:R.tx,ty:R.ty,ptx:R.ptx,pty:R.pty,prog:R.prog,path:R.path,busy:R.busy,ti:R.target?SHOPS.indexOf(R.target):-1}:null;
  LS.set(SAVE_KEY,{v:1,at:Date.now(),G:g,R:r,shops:SHOPS.map(s=>{const o={};SHOP_FIELDS.forEach(k=>o[k]=s[k]);o.obs=[...s.obs];return o;})});
  lastSave=G.time;
}
function savedInfo(){const d=LS.get(SAVE_KEY,null);return d&&d.v===1?d:null;}
function loadGame(){
  const d=savedInfo();if(!d)return false;
  newGame();Object.assign(G,d.G);G.mode='play';G.paused=false;
  if(d.R){R=Object.assign({},d.R,{target:d.R.ti>=0?SHOPS[d.R.ti]:null});delete R.ti;}
  d.shops.forEach((o,i)=>{Object.assign(SHOPS[i],o);SHOPS[i].obs=new Set(o.obs||[]);SHOPS[i].signKey='';});
  return d.G.mode||'play';
}
function resumeGame(){
  const m=loadGame();if(!m)return;
  setRain(G.rain);clearNav();peds.splice(0).forEach(p=>scene.remove(p.g));for(let i=0;i<14;i++)spawnPed(false);peds.forEach(p=>{p.grow=1;p.g.scale.setScalar(1);});
  G.areaName='';refreshSigns();updateCutaway(1);updateCamera(0,true);
  if(m==='morning'){showMorning();return;}
  closeCard();renderAll();keepAwake(true);toast(`${dateStr()} ${fmtT(G.time)} から再開`);
}
const clearSave=()=>LS.del(SAVE_KEY);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){saveGame();if(G.mode==='play'&&!G.paused)togglePause(true);}
  else if(G.mode==='play'&&!G.paused)keepAwake(true);
});
addEventListener('pagehide',saveGame);
// ---- install ----
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installHTML(){
  if(STANDALONE)return '<p class="note">✓ アプリとして起動中</p>';
  if(deferredInstall)return '<button class="btn" id="instBtn">📲 ホーム画面にアプリとして追加</button>';
  if(IOS)return '<p class="note">📲 アプリとして使うには、Safariの共有ボタン →「ホーム画面に追加」</p>';
  return '<p class="note">📲 ブラウザのメニューから「ホーム画面に追加」でアプリとして使えます</p>';
}
function bindInstall(){const b=$('#instBtn');if(b)b.onclick=async()=>{try{deferredInstall.prompt();await deferredInstall.userChoice;}catch(e){}deferredInstall=null;b.remove();};}
// ---- settings ----
function showSettings(){
  if(!['play','morning'].includes(G.mode))return;
  const prev=G.mode;if(prev==='play')togglePause(true);G.mode='settings';
  const opt=(k,l,sub)=>`<button class="btn${qMode===k?' pri':''}" data-q="${k}">${l}<small>${sub}</small></button>`;
  card(`<h3>⚙ 設定</h3>
    <p class="note">画質(いま:${QUAL[qLevel].label})</p>
    <div class="row" style="margin-top:4px">${opt('auto','自動','重いと自動で下げる')}${opt('high','高画質','影あり・高解像度')}${opt('std','標準','バランス')}${opt('saver','省電力','影なし・30fps')}</div>
    <div class="row"><button class="btn" id="vibBtn">振動:${vibOn?'オン':'オフ'}<small>着信・受注で振動(Android)</small></button><button class="btn" id="delBtn">セーブデータを消す<small>最初からやり直す</small></button></div>
    <div style="margin-top:12px">${installHTML()}</div>
    <div class="row"><button class="btn pri full" id="cl">閉じる</button></div>`);
  bindInstall();
  cardEl.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{qMode=b.dataset.q;LS.set('kpidash3d-q',qMode);qLevel=qMode==='auto'?(COARSE?'std':'high'):qMode;perf.t0=0;applyQuality();G.mode=prev;showSettings();});
  $('#vibBtn').onclick=()=>{vibOn=!vibOn;LS.set('kpidash3d-vib',vibOn);buzz(40);G.mode=prev;showSettings();};
  $('#delBtn').onclick=()=>{if(confirm('セーブデータを消して、タイトルに戻りますか?')){clearSave();location.reload();}};
  $('#cl').onclick=()=>{G.mode=prev;if(prev==='morning')showMorning();else closeCard();};
}
// ---- mobile sheet ----
function toggleSheet(force){const sd=$('.side'),open=force!==undefined?force:!sd.classList.contains('open');sd.classList.toggle('open',open);$('#sheetBack').hidden=!open;}
// ---- service worker (GitHub Pages) ----
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}

// ================= MAIN LOOP =================
let last=performance.now(),nearKey='',slowT=0;
let lastRender=0,lastMini=0;
function frame(now){
  const q=QUAL[qLevel];
  if(q.fps<60&&now-lastRender<1000/q.fps-3){requestAnimationFrame(frame);return;}
  lastRender=now;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  autoQuality(now,dt);
  if(G.mode==='play'&&G.time-lastSave>=10)saveGame();
  if(G.mode==='play'&&!G.paused){const gm=dt*TIME_SCALE;G.time+=gm;rivalAdvance(gm);}
  updatePlayer(dt);if(!G.paused){updatePeds(dt);updateCrowds(dt);updateCars(dt);updateTrain(dt);updateRain(dt);}
  // rival visual
  const rp=rivalPos(),vis=!!rp&&G.time>=600&&G.time<=18.5*60&&R.busy<=0;
  rival.visible=vis;rTag.visible=vis;
  if(vis){const moving=R.path.length>0;rival.position.set(rp.x+.9,0,rp.z+.9);if(moving){turnTo(rival,Math.atan2(rp.dx,rp.dz),dt);animWalk(rival,dt,3);}else animIdle(rival,dt,false);
    rival.userData.umb.visible=G.rain;rTag.position.set(rival.position.x,2.75,rival.position.z);}
  waterTex.offset.y-=dt*.08;
  fw.scale.setScalar(1+Math.sin(now/400)*.03);
  // near
  NEAR=G.mode==='play'?findNear():null;
  const nk=NEAR?NEAR.kind+NEAR.tx+','+NEAR.ty:'';
  if(nk!==nearKey){nearKey=nk;renderNear();const b=$('#actBtn');
    {const q=$('#pgQuick'),sh=NEAR&&NEAR.kind==='shop'&&!NEAR.ref.pageChecked&&!NEAR.ref.won&&!NEAR.ref.lost;q.hidden=!sh;if(sh)q.onclick=()=>{if(G.mode==='play'){const s=NEAR.ref;checkPage(s,()=>{G.mode='play';closeCard();nearKey='';});}};}
    if(NEAR){b.hidden=false;b.textContent=`${NEAR.ref.icon} ${NEAR.ref.name}に入る`+(matchMedia('(pointer:coarse)').matches?'':' [E]');doorRing.visible=true;doorRing.position.set(NEAR.px,.08,NEAR.pz);}
    else{b.hidden=true;doorRing.visible=false;}}
  if(doorRing.visible)doorRing.scale.setScalar(1+Math.sin(now/250)*.08);
  slowT-=dt;if(slowT<=0){slowT=.5;refreshSigns();if(NEAR)renderNear();}
  updateCutaway(dt);updateSky();updateCamera(dt);renderTick();
  if(!G.paused&&G.mode!=='title'&&G.mode!=='report'&&G.mode!=='final'&&G.mode!=='morning')checkCalls();
  if(G.mode==='play')checkEnd();
  if(G.mode==='visit'&&V&&V.sc){updateInterior(dt,now);renderer.render(V.sc,V.cam);}
  else{if(miniBig||now-lastMini>1000/q.mini){lastMini=now;drawMini();}renderer.render(scene,camera);}
  requestAnimationFrame(frame);
}

newGame();applyQuality();
for(let i=0;i<22;i++)spawnPed(false);
peds.forEach(p=>{p.grow=1;p.g.scale.setScalar(1);});
refreshSigns();updateCutaway(1);updateCamera(0,true);renderAll();showTitle();
requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{SHOPS.forEach(s=>s.signKey='');refreshSigns();buildMiniBase();});
})();
</script>
</body>
