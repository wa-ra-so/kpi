<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPIダッシュ!街まわり営業 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f6; --grid:#dae3ea; --ink:#1d2a4a; --ink-soft:#56627c; --block-line:#8fa1b3;
  --orange:#f09000; --orange-soft:#ffe2b0; --red:#d6413a; --green:#2f8f5b; --panel:#ffffff; --on-orange:#1d2a4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131a29; --grid:#1d273b; --ink:#e7ecf5; --ink-soft:#9aa6bf; --block-line:#4a5c80;
    --orange:#ffa31a; --orange-soft:#4a3410; --red:#ff6b61; --green:#5cc98a; --panel:#1a2336; --on-orange:#131a29;
  }
}
:root[data-theme="dark"]{
  --paper:#131a29; --grid:#1d273b; --ink:#e7ecf5; --ink-soft:#9aa6bf; --block-line:#4a5c80;
  --orange:#ffa31a; --orange-soft:#4a3410; --red:#ff6b61; --green:#5cc98a; --panel:#1a2336; --on-orange:#131a29;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{max-width:1320px;margin:0 auto;padding:10px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "view" "side"}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1fr) 310px;grid-template-areas:"hud hud" "view side";padding:14px 16px}}
.hud{grid-area:hud;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.hud h1{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1.3rem;margin:0;margin-right:auto}
.clock{font-family:"DotGothic16",sans-serif;font-size:1.9rem;line-height:1}
.chip{font-size:.88rem;color:var(--ink-soft)}
.stam{display:flex;align-items:center;gap:6px;font-size:.85rem}
.bar{position:relative;height:10px;border:2px solid var(--ink);border-radius:3px;background:var(--panel);overflow:hidden;display:block}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--orange);transition:width .25s}
.stam .bar{width:110px}
.stam .bar.low>i{background:var(--red)}

#view{grid-area:view;position:relative;min-width:0;height:62vh;min-height:360px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#9fc6e8;touch-action:none}
@media (min-width:900px){#view{height:calc(100vh - 120px);min-height:460px}}
#gl,#gl canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#mini{position:absolute;top:10px;right:10px;width:200px;height:143px;border:2px solid #1d2a4a;border-radius:8px;background:#f4f1ec;box-shadow:3px 3px 0 #1d2a4a;cursor:zoom-in;transition:width .2s,height .2s}
#mini.big{width:min(560px,80%);height:auto;aspect-ratio:28/20;cursor:zoom-out}
.miniTag{position:absolute;top:14px;right:16px;font:400 .75rem "DotGothic16",sans-serif;color:#1d2a4a;background:rgba(255,255,255,.85);padding:0 5px;border-radius:3px;pointer-events:none}
#banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);font:400 1.15rem "DotGothic16",sans-serif;color:#fff;background:rgba(20,26,45,.72);padding:4px 16px;border-radius:4px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#banner.show{opacity:1}
#actBtn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:1rem;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#actBtn:active{transform:translate(calc(-50% + 3px),3px)}
#joy{position:absolute;left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(29,42,74,.55);display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--orange);border:2px solid #1d2a4a}
@media (max-width:600px){#mini{width:132px;height:94px}#mini.big{width:92%;height:auto}.miniTag{right:14px}}
@media (pointer:coarse){#joy{display:block}#actBtn{left:auto;right:18px;transform:none}#actBtn:active{transform:translate(3px,3px)}}
.zoom{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px}
@media (pointer:coarse){.zoom{bottom:auto;top:170px}}
.zoom .btn{width:38px;height:38px;padding:0;font-size:1.1rem}
.keys{position:absolute;left:10px;bottom:8px;font-size:.78rem;color:#1d2a4a;background:rgba(255,255,255,.78);padding:2px 8px;border-radius:4px;pointer-events:none}
@media (pointer:coarse){.keys{display:none}}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:var(--panel);color:var(--ink)}

.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.box{border:2px solid var(--ink);border-radius:8px;background:var(--panel);padding:10px 12px}
.box h2{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.kpi{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:4px 8px;font-size:.9rem;margin:4px 0}
.kpi .bar{height:12px}
.kpi.done .bar>i{background:var(--green)}
.kpi span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.near{min-height:120px;font-size:.88rem}
.near .nm{font-weight:900;font-size:1rem}
.muted{color:var(--ink-soft)}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:3px;padding:0 5px;font-size:.78rem;margin:2px 4px 2px 0}
.tag.idle{border-color:var(--green);color:var(--green)}
.tag.peak,.tag.holiday,.tag.lost{border-color:var(--red);color:var(--red)}
.log{list-style:none;margin:0;padding:0;font-size:.84rem;max-height:180px;overflow:auto}
.log li{padding:3px 0;border-top:1px dashed var(--grid)}
.log li:first-child{border-top:0}
.log time{font-family:"DotGothic16",sans-serif;color:var(--ink-soft);margin-right:6px}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .05s,box-shadow .05s;user-select:none;-webkit-user-select:none;line-height:1.35}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn.pri{background:var(--orange);color:var(--on-orange)}
.btn.sm{padding:3px 8px;font-size:.8rem;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn small{font-weight:400;display:block;font-size:.78rem}
#view .btn{color:#1d2a4a;background:#fff;border-color:#1d2a4a;box-shadow:3px 3px 0 #1d2a4a}
#view .btn.pri{background:#f09000}
.overlay{position:fixed;inset:0;background:rgba(15,21,35,.6);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;overflow:auto}
.overlay[hidden]{display:none}
.card{width:100%;max-width:500px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);padding:18px;max-height:100%;overflow:auto}
.card.wide{max-width:780px}
.card h3{font-family:"DotGothic16",sans-serif;font-weight:400;font-size:1.35rem;margin:0 0 2px;line-height:1.3}
.card p{margin:.4em 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row .btn{flex:1 1 calc(50% - 10px)}
.row .btn.full{flex-basis:100%}
.shophead{display:flex;gap:12px;align-items:center}
.shophead .ic{font-size:2.3rem;line-height:1;width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--orange);border-radius:50%;background:var(--orange-soft);flex:none}
.who{font-size:.86rem;margin-top:8px;padding:6px 10px;border:1px dashed var(--block-line);border-radius:6px}
.who div{margin:1px 0}
.bubble{font-family:"DotGothic16",sans-serif;font-size:1.02rem;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;margin:14px 0 10px;position:relative;background:var(--paper);min-height:3.2em}
.bubble::before{content:"";position:absolute;top:-9px;left:24px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.bubble .sp{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:.78rem;color:var(--ink-soft);margin-bottom:2px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.meters .bar{height:14px}
.pips{letter-spacing:2px;color:var(--orange)}
.note{font-size:.84rem;color:var(--ink-soft);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
th,td{border-bottom:1px solid var(--grid);padding:6px 4px;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
.list td,.list th{text-align:left}
td.ok{color:var(--green);font-weight:700}
td.ng{color:var(--red);font-weight:700}
.tblwrap{overflow-x:auto}
.rank{font-family:"DotGothic16",sans-serif;font-size:4.5rem;line-height:1;color:var(--orange);margin:6px 0}
.slack{border-left:4px solid var(--orange);padding:6px 10px;background:var(--paper);border-radius:0 6px 6px 0;font-size:.92rem;margin-top:10px}
.rules{padding-left:1.2em;margin:.6em 0;font-size:.9rem}
.rules li{margin:.25em 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:.9rem;max-width:92vw;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--ink-soft)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// ================= RIVAL =================
let R=null;
function bfs(sx,sy,goal){
  const key=(x,y)=>y*COLS+x,gk=key(goal[0],goal[1]),prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){
    const [x,y]=q.shift();
    if(key(x,y)===gk){const p=[];let k=gk;while(k!==key(sx,sy)){p.unshift([k%COLS,Math.floor(k/COLS)]);k=prev.get(k);}return p;}
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(isRoad(nx,ny)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),key(x,y));q.push([nx,ny]);}}
  }
  return [];
}
function rivalAdvance(gm){
  if(!R||G.time<10*60||G.time>18*60+30)return;
  while(gm>0){
    if(R.busy>0){const u=Math.min(R.busy,gm);R.busy-=u;gm-=u;if(R.busy<=0)R.target=null;continue;}
    if(!R.target){
      const c=SHOPS.filter(s=>!s.won&&!s.lost&&!s.rivalToday&&s.closed!==G.day-1);
      if(!c.length)return;
      R.target=pick(c);R.path=bfs(R.tx,R.ty,R.target.door);R.prog=0;continue;
    }
    if(R.path.length){
      const need=(1-R.prog)/0.45;
      if(gm>=need){gm-=need;R.ptx=R.tx;R.pty=R.ty;[R.tx,R.ty]=R.path.shift();R.prog=0;}
      else{R.prog+=gm*0.45;gm=0;}
      continue;
    }
    const s=R.target;s.rivalToday=true;R.busy=18;
    if(!s.won){
      s.carry=Math.max(0,s.carry-8);
      const near=Math.hypot(G.x-wx(R.tx),G.z-wz(R.ty))<28;
      if(s.carry<25&&Math.random()<.12){s.lost=true;G.news.push(`${s.name}が他媒体と契約`);addLog(`⚠ ${s.name}、他媒体で決めたらしい…`);}
      else if(near)addLog(`他媒体の営業が${s.name}に入っていくのを見かけた`);
    }
  }
}
function rivalPos(){
  if(!R)return null;
  const nx=R.path.length?R.path[0]:[R.tx,R.ty];
  return {x:lerp(wx(R.tx),wx(nx[0]),R.prog),z:lerp(wz(R.ty),wz(nx[1]),R.prog),dx:nx[0]-R.tx,dz:nx[1]-R.ty};
}

    const d=pick(DIRS.filter(([dx,dy])=>isWalk(x+dx,y+dy)));if(!d)continue;

    const g=person(office?{shirt:'#f8f9fa',pants:pick(['#22223b','#2f3e46','#3d405b']),arm:pick(['#f8f9fa','#2f3e46']),tie:Math.random()<.5?pick(['#1d3557','#c1121f','#2a9d8f']):null,bag:Math.random()<.5}:{});

function enterShop(s){

      <div class="row">${lunch&&!G.ate?'<button class="btn pri" id="eat">客として食べる<small>30分・体力+30・信頼+1</small></button>':''}<button class="btn" id="ok">出直す</button></div>`);
    $('#ok').onclick=()=>{pass(3);addLog(`${s.name}:ピーク帯のため出直し`);G.mode='play';closeCard();renderAll();checkEnd();};
    const eat=$('#eat');if(eat)eat.onclick=()=>{G.ate=true;s.ate=true;s.trust=Math.min(3,s.trust+1);s.carry+=5;pass(30);G.stamina=clamp(G.stamina+30,0,100);
      addLog(`${s.name}でランチ`);msgCard('ランチ',`<p>${s.genre}をいただいた。食べながら店内を観察すると…<b>${s.clue}</b>。</p><p class="note">会計のとき${fn}さんと目が合った。次に来たとき覚えていてくれそうだ。</p>`);};
    $('#ok').focus();return;
  }
  G.today.visit++;

  const P=PERS[s.pers];

  const bossHere=!s.boss||s.boss.days.includes(G.day-1);
  E={s,st,interest:clamp(start,0,90),turns:Math.max(3,4+(st.k==='idle'?1:0)+P.turns),proposed:null,matched:false,meet:false,over:false,
     objection:null,dataShown:false,chats:0,bossHere,speaker:`${fn}さん`,line:greet(s,st)};
  s.met=true;G.mode='shop';pass(2);renderShop();
}
function greet(s,st){
  let l;
  if(!s.met)l=s.intro;
  else if(s.ate){l='あ、この前食べに来てくれた人だよね!どうだった?';s.ate=false;}
  else if(s.refusedBefore){l='この前断ったよね…まあ、話くらいは聞くけど';s.refusedBefore=false;}
  else if(s.carry>=45)l='この前の話、ちょっと考えてたんだよ';
  else if(st.k==='idle')l='ちょうど手が空いたところ。どうぞ';
  else l='はいはい、手短にお願いね';
  if(s.wrongProp)l+=`(${PRODUCTS[s.wrongProp].name}の話はもういいからね)`;
  if(s.rivalToday)l+=' …そういえば、さっき別の媒体の人も来てたよ';
  return l;
}
function staffCard(s,st){
  const fn=fnm(s),hints=[{t:`${fn}さんはだいたい${bestTime(s)}なら店にいますよ`,f:()=>{}}];
  if(!s.topicKnown)hints.push({t:`${fn}さん、${TOPICS[s.topic]}の話になると止まらないんですよ(笑)`,f:()=>{s.topicKnown=true;}});
  if(s.boss&&!s.bossKnown)hints.push({t:`お金のことを決めるのは${s.boss.who}で、${s.boss.days.map(d=>WD[d]).join('・')}曜に来ます`,f:()=>{s.bossKnown=true;}});
  if(!s.needKnown&&Math.random()<.5)hints.push({t:`最近${fn}さん、「${PRODUCTS[s.need].issue}」ってよくぼやいてます`,f:()=>{s.needKnown=true;}});

function dataLine(s){
  const n={予約:Math.round(s.seats*.6),集客:Math.round(s.seats*3.5),求人:ri(3,6)}[s.need];
  return {予約:`電話に出られないピーク中の予約、試算では月${n}件ほど取りこぼしています`,
          集客:`この立地と席数だと、平日夜に月${n}席分の空席が出ている計算です`,
          求人:`この周辺の飲食求人は、条件を合わせれば月${n}件ほど応募が見込めます`}[s.need];
}
function act(kind,arg){
  if(!E||E.over||E.turns<=0)return;
  const s=E.s,P=PERS[s.pers],fn=fnm(s);
  E.turns--;pass(10);G.stamina=clamp(G.stamina-3,0,100);E.speaker=`${fn}さん`;
  if(kind==='chat'){
    E.chats++;
    if(E.chats>=2&&(s.pers==='数字派'||s.pers==='職人気質')){E.interest-=5;E.line='…で、今日は何の用?';}
    else if(arg===s.topic){E.interest+=Math.round(14*P.chat);s.trust=Math.min(3,s.trust+2);s.topicKnown=true;E.line=TOPIC_LINE[arg];}
    else{E.interest+=Math.round(4*P.chat);s.trust=Math.min(3,s.trust+1);E.line=`へえ、${TOPICS[arg]}ねえ。(あまり興味はなさそうだ)`;}
  }
  else if(kind==='hear'){
    if(s.needKnown){E.interest+=6;E.line='前にも言ったけど、'+NEED_LINE[s.need];}
    else if(s.trust>=(s.pers==='職人気質'?2:1)||Math.random()<.25){s.needKnown=true;E.interest+=8;E.line=NEED_LINE[s.need];}
    else{E.interest+=2;s.trust=Math.min(3,s.trust+1);E.line='うーん、まあぼちぼちかな。(まだ本音は話してくれない)';}
  }
  else if(kind==='data'){
    E.dataShown=true;E.interest+=Math.round(16*P.data);
    E.speaker='あなた';E.line=dataLine(s)+(s.pers==='数字派'?'\n— 根拠を見せたら、身を乗り出してきた':'\n— 「へえ、そんなに?」と少し驚いている');
  }
  else if(kind==='prop'){
    if(s.pers==='職人気質'&&s.trust<2){E.interest-=5;E.line='まだあんたに店のことを任せる気にはならないな';}
    else{
      if(!E.meet){E.meet=true;G.today.meet++;}
      E.proposed=arg;
      if(arg===s.need){E.matched=true;s.wrongProp=null;E.interest+=s.needKnown?22+s.trust*6:14+s.trust*4;
        E.line=s.needKnown?'それ、まさに困ってたところだよ。詳しく聞かせて':'へえ、それはちょっと気になるかも';}
      else{E.matched=false;s.wrongProp=arg;E.interest-=10;E.line='うちはそこは間に合ってるかな…';}
    }
  }
  else if(kind==='resp'){
    if(RESP[arg]&&OBJ[E.objection].ok===arg){E.interest+=15;s.objCleared=true;E.line=RESP[arg].ok;E.objection=null;}
    else{E.interest-=12;E.line='いや、そういう話じゃなくてさ…';}
  }
  else if(kind==='close'){
    if(!E.bossHere){s.bossKnown=true;E.line=`いいとは思うんだけど、決めるのは${s.boss.who}なんだよね。${s.boss.days.map(d=>WD[d]).join('・')}曜にいるから、その時にもう一回来てくれる?`;}
    else if(!s.objCleared&&(s.pers==='慎重派'||Math.random()<.6)){E.objection=s.obj;E.line=OBJ[s.obj].line(yen(amount(E.proposed,s)));}
    else{
      const p=clamp(E.interest/100*(E.matched?1:.35)*P.close*(G.pray?1.1:1),0,.92);
      if(Math.random()<p){
        const a=amount(E.proposed,s);s.won=true;s.carry=0;G.today.win++;G.today.sales+=a;E.over=true;
        E.line=`わかった、やってみよう!申込書ちょうだい。\n— ${PRODUCTS[E.proposed].name} ${yen(a)}/月で受注`;
        addLog(`🎉 ${s.name}:${PRODUCTS[E.proposed].name}で受注 ${yen(a)}`);
      } else {
        E.interest-=15;
        if(E.interest<15){s.refused=true;s.carry=Math.max(0,s.carry-10);E.over=true;E.line='悪いけど、今回は見送りで。';addLog(`${s.name}:クロージング失敗。今日は断られた`);}
        else E.line='うーん…もうちょっと考えさせて。';
      }
    }
  }
  E.interest=clamp(E.interest,0,100);
  if(!E.over&&E.turns<=0)E.line+=' …ごめん、そろそろ戻らなきゃ。';
  renderHUD();renderShop();
}
function leaveShop(){
  const s=E.s;
  if(!s.won&&!s.refused){s.carry=Math.round(E.interest*.85);addLog(`${s.name}:見込み度${s.carry}で出直し`);}
  E=null;G.mode='play';closeCard();renderAll();checkEnd();
}
function renderShop(menu){

  else if(menu==='chat')btns=Object.keys(TOPICS).map(k=>`<button class="btn" data-t="${k}">${TOPICS[k]}${s.topicKnown&&k===s.topic?' ★':''}</button>`).join('')+`<button class="btn" id="back">戻る</button>`;

  else btns=`<button class="btn" data-a="chat" ${dis(true)}>雑談する</button>
      <button class="btn" data-a="hear" ${dis(true)}>ヒアリング</button>

      <button class="btn" data-a="prop" ${dis(true)}>提案する</button>
      <button class="btn pri full" data-a="close" ${dis(E.proposed)}>クロージング</button>
      <button class="btn full" id="leave">${E.over||E.turns<=0?'店を出る':'出直す(見込みを持ち越す)'}</button>`;
  card(`<div class="shophead"><div class="ic">${s.icon}</div><div><h3>${s.name}</h3>
    <div class="muted">${s.genre}/${s.seats}席 <span class="tag ${st.k}">${st.label} ${st.mark}</span></div></div></div>
    <div class="who">
      <div>店主:${s.owner}さん(${s.age})</div>
      <div>印象:${s.trust>0||E.chats>0||s.needKnown?`${s.pers}。${P.desc}`:'まだよくわからない'}</div>
      <div>店内の様子:${s.clue}</div>
      ${s.boss?`<div>決裁者:${s.bossKnown?`${s.boss.who}(${s.boss.days.map(d=>WD[d]).join('・')}曜に来店)${E.bossHere?' — 今日いる':' — 今日はいない'}`:'?'}</div>`:''}
    </div>
    <div class="bubble"><span class="sp">${E.speaker}</span>${E.line.replace(/\n/g,'<br>')}</div>
    <div class="meters">
      <span>見込み度</span><span class="bar"><i style="width:${E.interest}%"></i></span><span>${Math.round(E.interest)}</span>
      <span>信頼</span><span class="pips">${'●'.repeat(s.trust)}${'○'.repeat(3-s.trust)}</span><span></span>
      <span>課題</span><span>${s.needKnown?PRODUCTS[s.need].issue:'???(ヒアリングで判明)'}</span><span></span>
      <span>残り</span><span>${'▮'.repeat(Math.max(0,E.turns))}<span class="muted"> (1手=10分)</span></span><span></span>
    </div>
    ${E.proposed?`<p class="note">提案中:${PRODUCTS[E.proposed].name}${E.matched?'(刺さっている)':'(ズレている)'}</p>`:''}
    ${E.objection&&canAct?'<p class="note">懸念を出された。どう返す?</p>':''}
    <div class="row">${btns}</div>`);
  document.querySelectorAll('#card [data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='prop'||a==='chat')renderShop(a);else act(a);});
  document.querySelectorAll('#card [data-p]').forEach(b=>b.onclick=()=>act('prop',b.dataset.p));
  document.querySelectorAll('#card [data-t]').forEach(b=>b.onclick=()=>act('chat',b.dataset.t));
  document.querySelectorAll('#card [data-r]').forEach(b=>b.onclick=()=>act('resp',b.dataset.r));
  const back=$('#back');if(back)back.onclick=()=>renderShop();
  const lv=$('#leave');if(lv)lv.onclick=leaveShop;
  const f=$('#card button:not([disabled])');if(f)f.focus({preventScroll:true});
}

function showFinal(){

  const rate=Object.keys(Wk).reduce((a,k)=>a+Math.min(G.total[k]/Wk[k],1.5),0)/4;
  const rank=rate>=1.1?'S':rate>=.9?'A':rate>=.7?'B':'C';
  const msg={S:'部長賞。来期のエース候補だ',A:'目標達成。いい一週間だった',B:'あと一歩。回る順番と時間帯を見直そう',C:'まずは訪問数から。動けば数字はついてくる'}[rank];
  const lost=SHOPS.filter(s=>s.lost).length;
  let best=null;try{best=JSON.parse(localStorage.getItem('kpidash3d-best')||'null');}catch(e){}
  const isBest=!best||rate>best.rate;
  if(isBest){try{localStorage.setItem('kpidash3d-best',JSON.stringify({rate,rank,sales:G.total.sales}));}catch(e){}}
  const rows=Object.keys(Wk).map(k=>{const ok=G.total[k]>=Wk[k];return `<tr><td>${KPI_LABEL[k]}</td><td>${k==='sales'?yen(G.total[k]):G.total[k]}</td><td>${k==='sales'?yen(Wk[k]):Wk[k]}</td><td class="${ok?'ok':'ng'}">${ok?'達成':'未達'}</td></tr>`;}).join('');
  card(`<h3>週次評価</h3><div class="rank">${rank}</div><p>達成率 ${Math.round(rate*100)}%(各KPI上限150%で平均)</p>
    <table><tr><th>KPI</th><th>実績</th><th>週目標</th><th></th></tr>${rows}</table>

    <div class="slack"><b>部長</b>:${msg}</div>

    <div class="row"><button class="btn pri full" id="re">もう一週やる</button></div>`);
  $('#re').onclick=()=>{newGame();startDay();};$('#re').focus();
}
function showTitle(){
  card(`<h3>KPIダッシュ!街まわり営業</h3>
    <p>担当エリアは「ひなた駅」周辺。月曜から金曜の5日間で、飲食店を回ってKPIを積み上げよう。</p>
    <ul class="rules">
      <li><b>時間は流れ続ける</b>(1秒=2分)。9:00〜19:00、商談は1手10分</li>
      <li><b>時間帯</b>:ランチ・ディナーのピーク中は門前払い。14〜17時のアイドルタイムが狙い目。夜営業の店は午前中、店主がまだ来ていない</li>
      <li><b>人を見る</b>:店主ごとに性格と好きな話題がある。店内の様子、スタッフの話、朝のSlackがヒント</li>
      <li><b>商談</b>:雑談で信頼 → ヒアリングで課題 → データで機会損失 → 合う商材を提案 → 懸念に答えてクロージング</li>
      <li><b>決裁者</b>:店長に決める権限がない店もある。決裁者が来る曜日を狙う</li>
      <li><b>街</b>:他媒体の営業(赤い札)も回っている。見込みの薄い店は取られることがある</li>
      <li>右上のMAPで全体を確認。☕カフェ・🏪コンビニで回復、🏢営業所で日報を出して退勤</li>
    </ul>
    <p class="note">街・店名・人物・価格はすべて架空です。</p>
    <div class="row"><button class="btn pri full" id="go">出社する</button></div>`);
  $('#go').onclick=startDay;$('#go').focus();
}

// ================= UI =================
const ov=$('#ov'),cardEl=$('#card');
function card(html){cardEl.classList.remove('wide');cardEl.innerHTML=html;ov.hidden=false;keys.clear();}
function closeCard(){ov.hidden=true;cardEl.innerHTML='';}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);addLog(m);}
let lastClock='';
function renderHUD(){
  $('#date').textContent=dateStr();
  $('#weather').textContent=G.rain?'☔ 雨':'☀️ 晴れ';
  $('#kpis').innerHTML=Object.keys(TARGET).map(k=>{const v=G.today[k],t=TARGET[k];
    return `<div class="kpi ${v>=t?'done':''}"><span>${KPI_LABEL[k]}</span><span class="bar"><i style="width:${clamp(v/t*100,0,100)}%"></i></span><span>${k==='sales'?yen(v):v+'/'+t}</span></div>`;}).join('');
  renderNear();
}
function renderTick(){
  const c=fmtT(Math.min(G.time,END));if(c!==lastClock){lastClock=c;$('#clock').textContent=c;}
  const sb=$('#stambar');sb.firstElementChild.style.width=G.stamina+'%';sb.classList.toggle('low',G.stamina<20);
}
function renderNear(){
  const a=NEAR,el=$('#near');
  const rp=rival.visible?rival.position:null;
  const rivalNear=rp&&Math.hypot(rp.x-G.x,rp.z-G.z)<3?'<p class="note">他媒体の営業とすれ違った。軽く会釈された。</p>':'';
  if(!a){el.innerHTML=`<h2>周辺</h2><p class="muted">お店の入口に近づくと、ここに店舗情報が出ます。</p>${rivalNear}`;return;}
  const simple={cafe:[`☕ ${a.ref.name}`,'入ると20分休んで体力+40'],conv:['🏪 コンビニ','入ると5分で体力+15'],office:['🏢 営業所','入ると日報を書いて退勤できる'],
    shrine:['⛩️ ひなた神社',G.pray?'今日はお参り済み':'お参りするとクロージングが少し決まりやすくなる(1日1回)'],station:['🚉 ひなた駅','朝は通勤客、昼は買い物客で人通りが多い']};
  if(simple[a.kind]){el.innerHTML=`<h2>周辺</h2><div class="nm">${simple[a.kind][0]}</div><p class="muted">${simple[a.kind][1]}</p>${rivalNear}`;return;}
  const s=a.ref,st=status(s,G.time);
  el.innerHTML=`<h2>周辺</h2><div class="nm">${s.icon} ${s.name}</div>
    <div class="muted">${s.genre}/${s.seats}席/定休:${s.closed>=0?WD[s.closed]+'曜':'なし'}</div>
    <div class="muted">店主:${s.owner}さん(${s.age})${s.met?`/${s.pers}`:''}</div>
    <div><span class="tag ${st.k==='won'?'idle':st.k}">${st.label} ${st.mark}</span>${s.refused?'<span class="tag peak">本日お断り</span>':''}${s.rivalToday&&!s.won&&!s.lost?'<span class="tag peak">他社訪問あり</span>':''}</div>
    ${s.won||s.lost?'':`<div class="muted">見込み度 ${s.carry}/課題 ${s.needKnown?PRODUCTS[s.need].issue:'?'}/話題 ${s.topicKnown?TOPICS[s.topic]:'?'}</div>`}${rivalNear}`;
}
function renderLog(){$('#log').innerHTML=G.log.slice(0,14).map(l=>`<li><time>${fmtT(l.t)}</time>${l.text}</li>`).join('');}
function renderAll(){renderHUD();renderLog();renderTick();}
$('#listBtn').onclick=()=>{if(G.mode==='play')showList();};

// ================= MAIN LOOP =================
let last=performance.now(),nearKey='',slowT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.mode==='play'){const gm=dt*TIME_SCALE;G.time+=gm;rivalAdvance(gm);}
  updatePlayer(dt);updatePeds(dt);updateCrowds(dt);updateCars(dt);updateTrain(dt);updateRain(dt);
  // rival visual
  const rp=rivalPos(),vis=!!rp&&G.time>=600&&G.time<=18.5*60&&R.busy<=0;
  rival.visible=vis;rTag.visible=vis;
  if(vis){const moving=R.path.length>0;rival.position.set(rp.x+.9,0,rp.z+.9);if(moving){turnTo(rival,Math.atan2(rp.dx,rp.dz),dt);animWalk(rival,dt,3);}else animIdle(rival,dt,false);
    rival.userData.umb.visible=G.rain;rTag.position.set(rival.position.x,2.75,rival.position.z);}
  waterTex.offset.y-=dt*.08;
  fw.scale.setScalar(1+Math.sin(now/400)*.03);
  // near
  NEAR=G.mode==='play'?findNear():null;
  const nk=NEAR?NEAR.kind+NEAR.tx+','+NEAR.ty:'';
  if(nk!==nearKey){nearKey=nk;renderNear();const b=$('#actBtn');
    if(NEAR){b.hidden=false;b.textContent=`${NEAR.ref.icon} ${NEAR.ref.name}に入る`+(matchMedia('(pointer:coarse)').matches?'':' [E]');doorRing.visible=true;doorRing.position.set(NEAR.px,.08,NEAR.pz);}
    else{b.hidden=true;doorRing.visible=false;}}
  if(doorRing.visible)doorRing.scale.setScalar(1+Math.sin(now/250)*.08);
  slowT-=dt;if(slowT<=0){slowT=.5;refreshSigns();if(NEAR)renderNear();}
  updateCutaway(dt);updateSky();updateCamera(dt);renderTick();
  if(G.mode==='play')checkEnd();
  drawMini();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

newGame();resize();
for(let i=0;i<22;i++)spawnPed(false);
peds.forEach(p=>{p.grow=1;p.g.scale.setScalar(1);});
refreshSigns();updateCutaway(1);updateCamera(0,true);renderAll();showTitle();
requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{SHOPS.forEach(s=>s.signKey='');refreshSigns();buildMiniBase();});
})();
</script>
</body>
</html>
